<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --discord-blurple: #5865f2;
    --discord-blurple-dark: #4752c4;
    --discord-fuchsia: #eb459e;
    --discord-white: #ffffff;
    --bg-primary: #0b0d10;
    --bg-card: #1a1d24;
    --text-primary: #f2f3f5;
    --text-secondary: #b5bac1;
    --text-muted: #80848e;
    --border-color: #2a2d35;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background: {{BG_COLOR}};
    color: {{TEXT_COLOR}};
    position: relative;
    overflow: hidden;
  }

  {{THEME_OVERRIDE}}

  /* Subtle blurple radial glow, same as landing page hero */
  .glow {
    position: absolute;
    top: -260px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(88, 101, 242, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Secondary fuchsia glow bottom-right for depth */
  .glow-alt {
    position: absolute;
    bottom: -300px;
    right: -120px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(235, 69, 158, 0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Thin inner border frame, like the landing page cards */
  .frame {
    position: absolute;
    inset: 24px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ---- Logo row ---- */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
  }

  .logo-text {
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--text-primary);
    line-height: 1;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: var(--discord-blurple);
    color: var(--discord-white);
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.02em;
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
  }

  .badge-icon { width: 14px; height: 14px; flex-shrink: 0; }

  /* ---- Hero text ---- */
  .hero-title {
    font-size: 4rem;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-top: 8px;
  }

  .highlight {
    background: linear-gradient(135deg, var(--discord-blurple), var(--discord-fuchsia));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: 1.5rem;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-top: 22px;
    max-width: 880px;
  }

  /* ---- Feature pills ---- */
  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 32px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 100px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--discord-blurple);
    flex-shrink: 0;
  }

  /* Pill dot color variants — overridden by inline styles per pill */
  .pill-dot.fuchsia { background: var(--discord-fuchsia); }
  .pill-dot.green { background: #57f287; }
  .pill-dot.yellow { background: #fee75c; }

  /* ---- Footer ---- */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 28px;
    border-top: 1px solid var(--border-color);
  }

  .footer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 600;
  }

  .footer-brand img {
    width: 28px;
    height: 28px;
  }

  .footer-tag {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .footer-tag .sep {
    margin: 0 10px;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-alt"></div>
  <div class="frame"></div>

  <div class="wrap">
    <div>
      <div class="logo-row">
        <img src="{{LOGO_SRC}}" alt="Logo" class="logo-icon" />
        <span class="logo-text">{{LOGO_TEXT}}</span>
        {{BADGE}}
      </div>

      <h1 class="hero-title">Bring <span class="highlight">{{HIGHLIGHT}}</span><br />{{TITLE}}</h1>
      <p class="hero-subtitle">{{DESCRIPTION}}</p>

      <div class="pills">
{{PILLS}}
      </div>
    </div>

    <div class="footer">
      <div class="footer-brand">
        <img src="{{FOOTER_LOGO_SRC}}" alt="Brand" />
        <span>{{FOOTER_TEXT}}</span>
      </div>
      <div class="footer-tag">
        {{FOOTER_TAG}}
      </div>
    </div>
  </div>
</body>
</html>
