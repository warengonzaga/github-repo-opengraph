<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --discord-blurple: #5865f2;
    --discord-blurple-dark: #4752c4;
    --discord-fuchsia: #eb459e;
    --discord-white: #ffffff;
    --bg-primary: #0b0d10;
    --bg-card: #1a1d24;
    --text-primary: #f2f3f5;
    --text-secondary: #b5bac1;
    --text-muted: #80848e;
    --border-color: #2a2d35;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    background: {{BACKGROUND_COLOR}};
    color: {{TEXT_COLOR}};
    position: relative;
    overflow: hidden;
  }

  {{THEME_OVERRIDE}}

  /* Subtle blurple radial glow, same as landing page hero */
  .glow {
    position: absolute;
    top: -260px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(88, 101, 242, 0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Secondary fuchsia glow bottom-right for depth */
  .glow-alt {
    position: absolute;
    bottom: -300px;
    right: -120px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(235, 69, 158, 0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Thin inner border frame, like the landing page cards */
  .frame {
    position: absolute;
    inset: 24px;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ---- Logo row ---- */
  .project-identity {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .project-logo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
  }

  .project-name {
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--text-primary);
    line-height: 1;
  }

  .project-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: var(--discord-blurple);
    color: var(--discord-white);
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.02em;
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
  }

  .badge-icon { width: 14px; height: 14px; flex-shrink: 0; }

  /* ---- Hero text ---- */
  .headline {
    font-size: 4rem;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-top: 8px;
  }

  .text-tag { --tag-color: var(--discord-blurple); display: inline-flex; padding: 0.1em 0.4em; border-radius: 0.3em; color: var(--tag-color); background: color-mix(in srgb, var(--tag-color) 18%, transparent); font-size: 0.72em; vertical-align: 0.08em; }

  .inline-media { width: 1em; height: 1em; object-fit: contain; vertical-align: -0.12em; margin: 0 0.08em; }
  .inline-media.avatar { border-radius: 50%; }

  [data-style="highlight"] {
    background: linear-gradient(135deg, var(--discord-blurple), var(--discord-fuchsia));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  body[data-theme="light"] [data-style="highlight"] {
    background: none;
    color: var(--discord-blurple-dark);
    -webkit-text-fill-color: initial;
  }

  .description {
    font-size: 1.5rem;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-top: 22px;
    max-width: 880px;
  }

  /* ---- Supporting features ---- */
  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 32px;
  }

  .feature {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 100px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .feature-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--discord-blurple);
    flex-shrink: 0;
  }

  /* Feature dot colors are selected by the renderer. */

  /* ---- Footer ---- */
  .publisher {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 28px;
    border-top: 1px solid var(--border-color);
  }

  .publisher-identity {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 1rem;
    font-weight: 600;
  }

  .publisher-logo {
    width: 28px;
    height: 28px;
  }

  .publisher-tags {
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .publisher-tags .sep {
    margin: 0 10px;
    opacity: 0.5;
  }
</style>
</head>
<body data-theme="{{THEME}}">
  <div class="glow"></div>
  <div class="glow-alt"></div>
  <div class="frame"></div>

  <div class="wrap">
    <div>
      <div class="project-identity" data-slot="project">
        <img src="{{PROJECT_LOGO_SRC}}" alt="Project" class="project-logo" />
        <span class="project-name">{{PROJECT_NAME}}</span>
        {{BADGE}}
      </div>

      <h1 class="headline" data-slot="headline">{{HEADLINE}}</h1>
      <p class="description" data-slot="description">{{DESCRIPTION}}</p>

      <div class="features" data-slot="features">
{{FEATURES}}
      </div>
    </div>

    <div class="publisher" data-slot="publisher">
      <div class="publisher-identity">
        <img src="{{PUBLISHER_LOGO_SRC}}" alt="Publisher" class="publisher-logo" />
        <span>{{PUBLISHER_NAME}}</span>
      </div>
      <div class="publisher-tags">
        {{PUBLISHER_TAGS}}
      </div>
    </div>
  </div>
</body>
</html>
